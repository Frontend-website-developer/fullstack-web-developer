<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20202c"/>
      <stop offset="1" stop-color="#161620"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a24"/>
      <stop offset="1" stop-color="#0f0f18"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20202c"/>
      <stop offset="1" stop-color="#141420"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#08080e"/>
    </linearGradient>
    <pattern id="gridPattern" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#16161f" stroke-width="0.5"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="#fff"/>

  <!-- Accent glows -->
  <circle cx="200" cy="200" r="300" fill="#8b5cf6" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1400" cy="800" r="350" fill="#06b6d4" opacity="0.06" filter="url(#softGlow)"/>

  <!-- ===== LAPTOP (back layer) ===== -->
  <!-- Chassis -->
  <rect x="60" y="80" width="1160" height="720" rx="14" fill="url(#chassis)" stroke="#2a2a3a" stroke-width="1"/>
  <!-- Camera dot -->
  <circle cx="640" cy="98" r="3" fill="#0a0a12" stroke="#252535" stroke-width="0.5"/>
  <!-- Screen area -->
  <rect x="85" y="120" width="1110" height="660" rx="4" fill="url(#screen)"/>
  <rect x="85" y="120" width="1110" height="660" rx="4" fill="url(#gridPattern)"/>
  <rect x="85" y="120" width="1110" height="660" rx="4" fill="none" stroke="#1e1e2a" stroke-width="1.5" stroke-dasharray="10,8"/>
  <!-- Screen placeholder -->
  <g transform="translate(640, 425)" text-anchor="middle">
    <rect x="-130" y="-24" width="260" height="48" rx="24" fill="#12121e" stroke="#252535" stroke-width="1"/>
    <text y="5" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#6a6a80" font-weight="600" letter-spacing="2">LAPTOP SCREENSHOT</text>
  </g>
  <text x="640" y="480" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" fill="#3a3a48">1110 × 660 px</text>
  <!-- Base -->
  <path d="M 0 800 L 8 798 L 1272 798 L 1280 800 L 1300 848 L -20 848 Z" fill="url(#base)" stroke="#2a2a3a" stroke-width="1"/>
  <!-- Trackpad hinge notch -->
  <path d="M 560 798 Q 560 806, 568 806 L 712 806 Q 720 806, 720 798" fill="#0f0f18" stroke="#2a2a3a" stroke-width="1"/>
  <!-- Ground shadow -->
  <ellipse cx="640" cy="870" rx="600" ry="10" fill="#000" opacity="0.4" filter="url(#softGlow)"/>

  <!-- ===== PHONE (front layer, overlapping laptop right) ===== -->
  <!-- Phone shadow -->
  <ellipse cx="1350" cy="950" rx="160" ry="12" fill="#000" opacity="0.6" filter="url(#softGlow)"/>
  <!-- Phone body -->
  <rect x="1210" y="260" width="290" height="660" rx="42" fill="url(#phoneBody)" stroke="#2a2a3a" stroke-width="2"/>
  <!-- Phone screen -->
  <rect x="1222" y="272" width="266" height="636" rx="32" fill="url(#screen)"/>
  <rect x="1222" y="272" width="266" height="636" rx="32" fill="url(#gridPattern)"/>
  <rect x="1222" y="272" width="266" height="636" rx="32" fill="none" stroke="#1e1e2a" stroke-width="1.5" stroke-dasharray="10,8"/>
  <!-- Dynamic Island -->
  <rect x="1298" y="288" width="115" height="24" rx="12" fill="#000"/>
  <!-- Home indicator -->
  <rect x="1325" y="890" width="60" height="3" rx="1.5" fill="#3a3a48"/>
  <!-- Phone placeholder -->
  <g transform="translate(1355, 580)" text-anchor="middle">
    <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#12121e" stroke="#252535" stroke-width="1"/>
    <text y="4" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6a6a80" font-weight="600" letter-spacing="1.5">MOBILE VIEW</text>
  </g>
  <text x="1355" y="625" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#3a3a48">266 × 636 px</text>
</svg>
